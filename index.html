        window.addEventListener('resize',onWindowResize);
    }
    function createCoreOrb(){const g=new THREE.Group();const im=new THREE.MeshBasicMaterial({color:PALETTE.white,transparent:true,opacity:0.8});g.add(new THREE.Mesh(new THREE.SphereGeometry(0.3,32,32),im));const om=new THREE.MeshBasicMaterial({color:PALETTE.jade,transparent:true,opacity:0.25,blending:THREE.AdditiveBlending,depthWrite:false});g.add(new THREE.Mesh(new THREE.SphereGeometry(0.7,32,32),om));g.add(new THREE.PointLight(0x00ff88,2,25));scene.add(g);coreOrbData={group:g,inner:g.children[0],outer:g.children[1],light:g.children[2],innerMat:im,outerMat:om};}
    function createRuneCircles(){const cfgs=[{r:3.5,tube:0.018,c:PALETTE.jade,op:0.22,sp:0.35,tilt:0,mc:8},{r:5,tube:0.022,c:PALETTE.cyan,op:0.18,sp:-0.22,tilt:0.06,mc:10},{r:6.5,tube:0.016,c:PALETTE.jade,op:0.15,sp:0.16,tilt:-0.04,mc:12},{r:8,tube:0.02,c:PALETTE.gold,op:0.1,sp:-0.1,tilt:0.05,mc:14},{r:10,tube:0.014,c:PALETTE.cyan,op:0.08,sp:0.07,tilt:-0.03,mc:16}];for(const c of cfgs){const rg=new THREE.Group();const tm=new THREE.MeshBasicMaterial({color:c.c,transparent:true,opacity:c.op,blending:THREE.AdditiveBlending,depthWrite:false});rg.add(new THREE.Mesh(new THREE.TorusGeometry(c.r,c.tube,8,128),tm));rg.add(new THREE.Mesh(new THREE.TorusGeometry(c.r,c.tube*2.5,8,128),new THREE.MeshBasicMaterial({color:c.c,transparent:true,opacity:c.op*0.3,blending:THREE.AdditiveBlending,depthWrite:false})));const mkrs=[];for(let m=0;m<c.mc;m++){const a=m/c.mc*Math.PI*2,mm=new THREE.MeshBasicMaterial({color:c.c,transparent:true,opacity:c.op*2,blending:THREE.AdditiveBlending,depthWrite:false}),mk=new THREE.Mesh(new THREE.OctahedronGeometry(0.06,0),mm);mk.position.set(Math.cos(a)*c.r,Math.sin(a)*c.r,0);rg.add(mk);mkrs.push(mk);}rg.rotation.x=Math.PI/2+c.tilt;rg.userData={speed:c.sp,baseOpacity:c.op,markers:mkrs,torusMat:tm};scene.add(rg);runeCircleGroups.push(rg);}}
    function createAtmosphericParticles(){const c=CONFIG.ATMO_COUNT,p=new Float32Array(c*3),cl=new Float32Array(c*3);for(let i=0;i<c;i++){p[i*3]=(Math.random()-0.5)*60;p[i*3+1]=(Math.random()-0.5)*60;p[i*3+2]=(Math.random()-0.5)*60;const r=Math.random();if(r<0.15){cl[i*3]=1;cl[i*3+1]=0.84;cl[i*3+2]=0;}else if(r<0.5){cl[i*3]=0;cl[i*3+1]=0.9;cl[i*3+2]=1;}else{cl[i*3]=0;cl[i*3+1]=1;cl[i*3+2]=0.53;}}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(p,3));geo.setAttribute('color',new THREE.BufferAttribute(cl,3));atmosphericParticles=new THREE.Points(geo,new THREE.PointsMaterial({size:0.1,transparent:true,opacity:0.18,vertexColors:true,sizeAttenuation:true,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(atmosphericParticles);}
    function createShockwave(){const m=new THREE.Mesh(new THREE.TorusGeometry(1,0.4,8,64),new THREE.MeshBasicMaterial({color:PALETTE.jade,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));m.rotation.x=Math.PI/2;m.visible=false;scene.add(m);shockwaveData={mesh:m,mat:m.material,active:false,progress:0};}
    function triggerShockwave(){shockwaveData.active=true;shockwaveData.progress=0;shockwaveData.mesh.visible=true;shockwaveData.mesh.scale.set(0.1,0.1,0.1);}
    function createStarField(){const c=CONFIG.STAR_COUNT,p=new Float32Array(c*3),cl=new Float32Array(c*3);for(let i=0;i<c;i++){p[i*3]=(Math.random()-0.5)*200;p[i*3+1]=(Math.random()-0.5)*200;p[i*3+2]=(Math.random()-0.5)*200;const r=Math.random();if(r<0.65){const v=0.7+Math.random()*0.3;cl[i*3]=v;cl[i*3+1]=v;cl[i*3+2]=v;}else if(r<0.82){cl[i*3]=0.2;cl[i*3+1]=0.85;cl[i*3+2]=1;}else{cl[i*3]=0;cl[i*3+1]=1;cl[i*3+2]=0.53;}}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(p,3));geo.setAttribute('color',new THREE.BufferAttribute(cl,3));starField=new THREE.Points(geo,new THREE.PointsMaterial({size:0.25,transparent:true,opacity:0.55,vertexColors:true,sizeAttenuation:true,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(starField);}
    function createLightBeam(){const g=new THREE.Group();const bm=new THREE.MeshBasicMaterial({color:PALETTE.jade,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.35,CONFIG.BEAM_HEIGHT,16,1,true),bm).translateY(CONFIG.BEAM_HEIGHT/2));const cm=new THREE.MeshBasicMaterial({color:PALETTE.white,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.08,CONFIG.BEAM_HEIGHT,8,1,true),cm).translateY(CONFIG.BEAM_HEIGHT/2));const rm=new THREE.MeshBasicMaterial({color:PALETTE.cyan,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});const gr=new THREE.Mesh(new THREE.TorusGeometry(0.5,0.08,8,32),rm);gr.position.y=CONFIG.BEAM_HEIGHT;gr.rotation.x=Math.PI/2;g.add(gr);const bam=new THREE.MeshBasicMaterial({color:PALETTE.jade,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});const br=new THREE.Mesh(new THREE.TorusGeometry(0.8,0.04,8,32),bam);br.position.y=0.3;br.rotation.x=Math.PI/2;g.add(br);scene.add(g);lightBeamData={group:g,beamMat:bm,coreMat:cm,ringMat:rm,glowRing:gr,baseMat:bam,baseRing:br};}
    function onWindowResize(){camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);composer.setSize(window.innerWidth,window.innerHeight);}

    async function initHandTracking(){const v=document.getElementById('video'),c=document.getElementById('canvas-overlay'),ctx=c.getContext('2d');try{const s=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480}});v.srcObject=s;await new Promise(r=>{v.onloadedmetadata=()=>{c.width=v.videoWidth;c.height=v.videoHeight;r();};});document.getElementById('loading').classList.add('hidden');const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:0.7,minTrackingConfidence:0.5});hands.onResults(r=>{ctx.clearRect(0,0,c.width,c.height);if(r.multiHandLandmarks&&r.multiHandLandmarks.length>0){handDetected=true;handLandmarks=r.multiHandLandmarks[0];drawHand(ctx,handLandmarks,c.width,c.height);recognizeGesture(handLandmarks);updateHandDirection(handLandmarks);}else{handDetected=false;gestureType='none';}});const df=async()=>{await hands.send({image:v});requestAnimationFrame(df);};v.onloadeddata=()=>{df();};}catch(e){console.error(e);document.getElementById('loading').textContent='摄像头初始化失败，请检查权限';}}
    function drawHand(ctx,l,w,h){ctx.fillStyle='#00ff88';ctx.strokeStyle='#00ff88';ctx.lineWidth=2;const cs=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];ctx.beginPath();for(const[i,j]of cs){ctx.moveTo(l[i].x*w,l[i].y*h);ctx.lineTo(l[j].x*w,l[j].y*h);}ctx.stroke();for(const p of l){ctx.beginPath();ctx.arc(p.x*w,p.y*h,4,0,Math.PI*2);ctx.fill();}}
    function recognizeGesture(l){const f=getFingerStates(l),fc=f.filter(f=>f).length,ps=getPalmSize(l);previousGesture=gestureType;if(fc===1&&f[1]){gestureType='point';targetMode='fly';document.getElementById('mode-display').textContent='御剑飞行';}else if(fc===0&&ps>0.08){gestureType='fist';targetMode='sphere';document.getElementById('mode-display').textContent='剑阵归位';}else if(fc===5){gestureType='open';targetMode='scatter';document.getElementById('mode-display').textContent='天女散剑';}else if(fc===4&&f[1]&&f[2]&&f[3]){gestureType='four';targetMode='giant';document.getElementById('mode-display').textContent='万剑归宗';}else if(fc===3&&f[1]&&f[2]){gestureType='three';targetMode='wuji';document.getElementById('mode-display').textContent='无极剑涡';}else if(fc===2&&f[1]&&f[2]){gestureType='two';targetMode='rain';document.getElementById('mode-display').textContent='大庚剑阵';}if(previousGesture!==gestureType&&gestureType!=='none'){isTransitioning=true;transitionProgress=0;triggerShockwave();}}
    function getFingerStates(l){const f=[];f.push(l[4].x<l[3].x);const ts=[8,12,16,20],ps=[6,10,14,18];for(let i=0;i<4;i++)f.push(l[ts[i]].y<l[ps[i]].y-0.02);return f;}
    function getPalmSize(l){const w=l[0],m=l[9];return Math.sqrt((w.x-m.x)**2+(w.y-m.y)**2);}
    function updateHandDirection(l){handDirection.set((l[8].x-0.5)*2*15,-(l[8].y-0.5)*2*15,-10);handPosition.set((l[9].x-0.5)*30,-(l[9].y-0.5)*30,0);}

    let time=0;
    function animate(){
        requestAnimationFrame(animate);time+=0.016;sphereRotation+=0.005;frameCount++;
        if(isTransitioning){transitionProgress+=0.02;if(transitionProgress>=1){isTransitioning=false;currentMode=targetMode;if(currentMode==='giant')giantStartTime=time;}}else{currentMode=targetMode;}
        if(currentMode==='rain'){const r=Math.pow(Math.max(0,Math.sin(time*0.4)),3);dagengContract+=(r-dagengContract)*0.08;}else dagengContract*=0.95;
        if(currentMode==='wuji'){vortexPulse+=(Math.sin(time*0.6)*0.5+0.5-vortexPulse)*0.08;}else vortexPulse*=0.95;
        const ft=handDirection.clone();
        for(const s of swords){
            switch(currentMode){
                case'sphere':s.updateSphereMode(time);s.targetScale=1;break;
                case'fly':s.updateFlyMode(swords,ft);s.targetScale=1;break;
                case'scatter':s.updateScatterMode(time);s.targetScale=0.8;break;
                case'rain':s.updateDaGengMode(time);break;
                case'wuji':s.updateWujiMode(time);break;
                case'giant':s.updateGiantSwordMode(time);s.targetScale=1;break;
            }s.updateMesh();
        }
        for(const s of swords){
            if(frameCount%CONFIG.TRAIL_EMIT_INTERVAL===s.index%CONFIG.TRAIL_EMIT_INTERVAL){
                const tip=s.getTipWorld(),c=s.swordColor,spd=s.velocity.length();
                const wb=(currentMode==='wuji')?2.5:(currentMode==='giant')?1.2:1,fb=(currentMode==='fly')?(1+Math.pow(spd/CONFIG.MAX_SPEED,2)*0.25):1;
                const sz=(0.2+spd*3)*wb*fb,lt=(CONFIG.TRAIL_LIFETIME+Math.floor(spd*200))*wb*(1+(fb-1)*0.3);
                const tc=currentMode==='fly'?c.clone().lerp(PALETTE.white,Math.min(spd/CONFIG.MAX_SPEED*0.3,0.3)):currentMode==='giant'?c.clone().lerp(PALETTE.gold,0.2):c;
                trailSystem.emit(tip.x,tip.y,tip.z,tc.r,tc.g,tc.b,sz,lt);
            }
        }
        trailSystem.update();energyWeb.update(swords,time);
        updateCoreOrb(time);updateRuneCircles(time);updateAtmosphericParticles(time);
        if(currentMode==='fly'){let ts=0;for(const s of swords)ts+=s.velocity.length();prevFlySpeed=ts/swords.length;}else prevFlySpeed=0;
        updateShockwave();updateLightBeam(time);updateSkyBackground();
        updateCamera();if(starField)starField.rotation.y+=0.00015;
        composer.render();
    }
    function updateCoreOrb(time){const tv=(currentMode==='sphere')?1:(currentMode==='rain')?0.6+dagengContract*0.8:(currentMode==='wuji')?0.8+vortexPulse*0.6:(currentMode==='giant')?1.0:0.15;const spd=isTransitioning?0.15:0.04;coreVisibility+=(tv-coreVisibility)*spd;const b=Math.sin(time*2)*0.3+0.7,v=coreVisibility;coreOrbData.innerMat.opacity=(0.5+b*0.3)*v;coreOrbData.outerMat.opacity=(0.15+b*0.15)*v;const s=(0.8+b*0.4)*v;coreOrbData.outer.scale.set(s,s,s);coreOrbData.light.intensity=(1+b*2.5)*v;coreOrbData.group.visible=v>0.02;}
    function updateRuneCircles(time){const tv=(currentMode==='sphere')?1:(currentMode==='rain')?0.6:(currentMode==='wuji')?0.5:(currentMode==='giant')?0.5:0.05;const b=Math.sin(time*2)*0.3+0.7;for(const rg of runeCircleGroups){const ud=rg.userData;rg.rotation.z+=ud.speed*0.016;rg.children[0].material.opacity=ud.baseOpacity*(0.6+b*0.4)*tv;rg.children[1].material.opacity=ud.baseOpacity*0.3*(0.5+b*0.5)*tv;for(const m of ud.markers){m.material.opacity=ud.baseOpacity*2*(0.4+b*0.6)*tv;m.rotation.y+=0.03;m.rotation.x+=0.01;}rg.visible=tv>0.02;}}
    function updateAtmosphericParticles(time){const p=atmosphericParticles.geometry.attributes.position.array,c=CONFIG.ATMO_COUNT;for(let i=0;i<c;i++){p[i*3+1]+=0.007;p[i*3]+=Math.sin(time*0.5+i*0.3)*0.002;p[i*3+2]+=Math.cos(time*0.3+i*0.2)*0.0015;if(p[i*3+1]>30)p[i*3+1]=-30;}atmosphericParticles.geometry.attributes.position.needsUpdate=true;atmosphericParticles.material.opacity=0.14+Math.sin(time*1.5)*0.04;}
    function updateShockwave(){if(!shockwaveData.active)return;shockwaveData.progress+=0.016/CONFIG.SHOCKWAVE_DURATION;if(shockwaveData.progress>=1){shockwaveData.active=false;shockwaveData.mesh.visible=false;}else{const r=CONFIG.SHOCKWAVE_MAX_RADIUS*shockwaveData.progress;shockwaveData.mesh.scale.set(r,r,r);shockwaveData.mat.opacity=(1-shockwaveData.progress)*0.12;}}
    function updateLightBeam(time){if(!lightBeamData)return;const r=currentMode==='rain';const to=r?(0.08+dagengContract*0.35):0,tc=r?(0.1+dagengContract*0.5):0;lightBeamData.beamMat.opacity+=(to-lightBeamData.beamMat.opacity)*0.05;lightBeamData.coreMat.opacity+=(tc-lightBeamData.coreMat.opacity)*0.05;const rt=r?dagengContract*0.5:0;lightBeamData.ringMat.opacity+=(rt-lightBeamData.ringMat.opacity)*0.05;if(r){const s=1+dagengContract*4;lightBeamData.glowRing.scale.set(s,s,s);}const bt=r?(0.06+dagengContract*0.2):0;lightBeamData.baseMat.opacity+=(bt-lightBeamData.baseMat.opacity)*0.05;if(r){const bs=1+dagengContract*2;lightBeamData.baseRing.scale.set(bs,bs,bs);}lightBeamData.group.visible=lightBeamData.beamMat.opacity>0.005;}
    function updateSkyBackground(){const t=(currentMode==='giant')?skyGiantColor:(currentMode==='wuji')?skyWujiColor:(currentMode==='rain')?skyStormColor:skyBaseColor;const spd=isTransitioning?0.12:0.02;scene.background.lerp(t,spd);scene.fog.color.lerp(t,spd);}
    function updateCamera(){let tp;switch(currentMode){case'sphere':tp=new THREE.Vector3(0,0,25);cameraTarget.set(0,0,0);break;case'fly':{const c=getSwordsCenter();tp=new THREE.Vector3(c.x*0.3,c.y*0.3,25+c.z*0.2);cameraTarget.lerp(c,0.05);break;}case'scatter':tp=new THREE.Vector3(0,0,35);cameraTarget.set(0,0,0);break;case'rain':{const a=time*CONFIG.ORBIT_SPEED;tp=new THREE.Vector3(Math.cos(a)*CONFIG.ORBIT_RADIUS,-5+Math.sin(time*0.3)*1.5,Math.sin(a)*CONFIG.ORBIT_RADIUS);cameraTarget.set(0,4+Math.sin(time*0.2)*0.5,0);break;}case'wuji':{const a=time*0.06;tp=new THREE.Vector3(Math.cos(a)*16,1+Math.sin(time*0.25)*1.5,Math.sin(a)*16);cameraTarget.set(0,2+Math.sin(time*0.15)*0.5,0);break;}case'giant':{const ft=time*0.12,cx=Math.sin(ft)*8,cz=Math.sin(ft*2)*4,cy=Math.sin(ft*0.5)*2+1;if(time-giantStartTime<5){tp=new THREE.Vector3(cx,cy,cz+20);cameraTarget.set(cx,cy+2,cz);}else{const ot=time-5,rd=Math.max(14,28-ot*0.4),a=time*0.15,scan=Math.sin(ot*0.06);tp=new THREE.Vector3(cx+Math.cos(a)*rd,cy+scan*3,cz+Math.sin(a)*rd);cameraTarget.set(cx,cy-scan*1.5,cz);}break;}}camera.position.lerp(tp,0.03);camera.lookAt(cameraTarget);}
    function getSwordsCenter(){const c=new THREE.Vector3();for(const s of swords)c.add(s.position);c.divideScalar(swords.length);return c;}

    initScene();animate();
    document.addEventListener('mousemove',e=>{const x=(e.clientX/window.innerWidth)*2-1,y=-(e.clientY/window.innerHeight)*2+1;handDirection.set(x*15,y*15,-10);handDetected=true;});
    document.addEventListener('keydown',e=>{const modes={'1':'fly','2':'sphere','3':'scatter','4':'rain','5':'wuji','6':'giant'};const names={'1':'御剑飞行','2':'剑阵归位','3':'天女散剑','4':'大庚剑阵','5':'无极剑涡','6':'万剑归宗'};if(modes[e.key]&&modes[e.key]!==currentMode){targetMode=modes[e.key];document.getElementById('mode-display').textContent=names[e.key];isTransitioning=true;transitionProgress=0;triggerShockwave();}});
    const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js';script.crossOrigin='anonymous';
    script.onload=()=>{initHandTracking();};document.head.appendChild(script);
    </script>
</body>
